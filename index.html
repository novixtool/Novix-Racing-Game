<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Novix Racing 2D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { width: 100%; height: 100%; display: block; }

    /* HUD - Clean Modern */
    #hud {
      position: fixed; top: 20px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; pointer-events: none;
      color: #fff; font-weight: 800; text-transform: uppercase;
    }
    .hud-card {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 14px;
      border-radius: 8px;
    }
    .hud-title { font-size: 11px; color: #aaa; letter-spacing: 1px; }
    .hud-val { font-size: 22px; font-weight: 900; color: #fff; }

    /* Speedometer - Needle Style */
    #speedo-wrap {
      position: fixed; bottom: 20px; right: 20px; pointer-events: none;
      width: 150px; height: 150px;
      background: radial-gradient(circle, #1a1a2e 0%, #000 70%);
      border: 3px solid #333;
      border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
    }
    #speedo-val { font-size: 36px; font-weight: 900; color: #fff; line-height: 1; }
    #speedo-unit { font-size: 11px; font-weight: bold; color: #ff4444; margin-top: 2px; }

    /* Controls */
    #controls {
      position: fixed; bottom: 30px; left: 24px;
      display: flex; gap: 20px;
    }
    .ctrl-btn {
      width: 75px; height: 75px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.5);
      color: #fff; font-size: 30px;
      display: flex; align-items: center; justify-content: center;
      outline: none; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .ctrl-btn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.95); }

    /* Menus - Dark Professional */
    .panel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); }
    .box {
      background: #0d1117;
      border: 1px solid #30363d;
      color: white; padding: 30px 24px; border-radius: 12px;
      text-align: center; width: 90%; max-width: 400px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
    }
    .box h1 { font-size: 28px; color: #fff; margin-bottom: 6px; }
    .btn-action {
      margin-top: 18px; padding: 14px 40px; border: 0; border-radius: 8px;
      background: linear-gradient(135deg, #ff4444, #cc0000);
      color: white; font-size: 18px; font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,68,68,0.4);
    }
    .btn-action:hover { transform: scale(1.02); }
    .hide { display: none !important; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud" class="hide">
    <div class="hud-card"><div class="hud-title">POS</div><div class="hud-val" id="pos">3/6</div></div>
    <div style="display:flex; gap:10px;">
      <div class="hud-card"><div class="hud-title">TIME</div><div class="hud-val" id="timer">00:00</div></div>
      <div class="hud-card"><div class="hud-title">SCORE</div><div class="hud-val" id="score">0</div></div>
    </div>
  </div>

  <div id="speedo-wrap" class="hide">
    <div id="speedo-val">0</div>
    <div id="speedo-unit">KM/H</div>
  </div>

  <div id="controls" class="hide">
    <button class="ctrl-btn" id="btn-l">◀</button>
    <button class="ctrl-btn" id="btn-r">▶</button>
  </div>

  <div id="menu" class="panel">
    <div class="box">
      <h1>NOVIX RACING</h1>
      <p style="color:#888; font-size:14px; margin-bottom:15px;">2D ARCADE RACER</p>
      <button class="btn-action" id="start-btn">PLAY</button>
      <button class="btn-action" style="background:linear-gradient(135deg,#444,#222);" onclick="alert('Garage Coming Soon!')">GARAGE</button>
      <button class="btn-action" style="background:linear-gradient(135deg,#444,#222);" onclick="alert('Settings Coming Soon!')">SETTINGS</button>
      <button class="btn-action" style="background:linear-gradient(135deg,#444,#222);" onclick="alert('Thanks for playing!')">EXIT</button>
    </div>
  </div>

  <div id="over" class="panel hide">
    <div class="box">
      <h1 style="color:#ff4444;">CRASHED!</h1>
      <p style="margin: 15px 0; font-size:18px;">Final Score: <b id="final-score" style="color:#38bdf8;">0</b></p>
      <button class="btn-action" id="again-btn">TRY AGAIN</button>
    </div>
  </div>

<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let W, H, horizon, run = false, lastTime = 0;
let carX = 0, speed = 0, maxSpeed = 260, score = 0, elapsed = 0;
let traffic = [], key = { l: false, r: false };

function resize() {
  W = innerWidth; H = innerHeight;
  c.width = W * devicePixelRatio; c.height = H * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  horizon = H * 0.45;
}
window.addEventListener('resize', resize);
resize();

// **Realistic Car Drawing (Rear View - White Stripes)**
function drawSportsCar(x, y, scale, color, isPlayer = false) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.ellipse(0, 20, 55, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  // Tires
  ctx.fillStyle = '#111';
  ctx.fillRect(-50, 2, 16, 28);
  ctx.fillRect(34, 2, 16, 28);

  // Body
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(-45, -15, 90, 40, [10, 10, 6, 6]);
  ctx.fill();

  // White Racing Stripes (for player)
  if (isPlayer) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(-6, -15, 5, 40);
    ctx.fillRect(3, -15, 5, 40);
  }

  // Cabin / Windshield
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.moveTo(-30, -15);
  ctx.lineTo(30, -15);
  ctx.lineTo(22, -38);
  ctx.lineTo(-22, -38);
  ctx.closePath();
  ctx.fill();

  // Glass Reflection
  ctx.fillStyle = 'rgba(100,200,255,0.3)';
  ctx.beginPath();
  ctx.moveTo(-15, -35);
  ctx.lineTo(10, -35);
  ctx.lineTo(5, -17);
  ctx.lineTo(-18, -17);
  ctx.closePath();
  ctx.fill();

  // Tail Lights
  ctx.fillStyle = '#ff0000';
  ctx.fillRect(-40, -7, 18, 7);
  ctx.fillRect(22, -7, 18, 7);

  ctx.restore();
}

// **Realistic Environment**
function drawEnvironment() {
  // Sky
  let sky = ctx.createLinearGradient(0, 0, 0, horizon);
  sky.addColorStop(0, '#4a90d9');
  sky.addColorStop(1, '#87ceeb');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, horizon);

  // Clouds
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  for (let i = 0; i < 5; i++) {
    let cx = (i * 300 + 100) % W;
    let cy = 50 + i * 25;
    ctx.beginPath();
    ctx.arc(cx, cy, 30, 0, Math.PI * 2);
    ctx.arc(cx + 20, cy - 10, 25, 0, Math.PI * 2);
    ctx.arc(cx + 40, cy, 20, 0, Math.PI * 2);
    ctx.fill();
  }

  // Mountains (Layered)
  ctx.fillStyle = '#2d5a27';
  ctx.beginPath();
  ctx.moveTo(0, horizon);
  ctx.lineTo(W * 0.2, horizon - 70);
  ctx.lineTo(W * 0.4, horizon - 20);
  ctx.lineTo(W * 0.6, horizon - 80);
  ctx.lineTo(W * 0.8, horizon - 30);
  ctx.lineTo(W, horizon);
  ctx.fill();

  ctx.fillStyle = '#1e4d1e';
  ctx.beginPath();
  ctx.moveTo(0, horizon);
  ctx.lineTo(W * 0.3, horizon - 40);
  ctx.lineTo(W * 0.5, horizon - 60);
  ctx.lineTo(W * 0.7, horizon - 20);
  ctx.lineTo(W, horizon);
  ctx.fill();

  // Ground
  ctx.fillStyle = '#3e7d32';
  ctx.fillRect(0, horizon, W, H - horizon);
}

// **Road with Side Stripes**
let roadOffset = 0;
function drawRoad() {
  let roadBottomW = Math.min(W * 0.9, 600);
  let roadTopW = roadBottomW * 0.1;
  let cx = W / 2;

  // Road
  ctx.fillStyle = '#3a3a3a';
  ctx.beginPath();
  ctx.moveTo(cx - roadTopW / 2, horizon);
  ctx.lineTo(cx + roadTopW / 2, horizon);
  ctx.lineTo(cx + roadBottomW / 2, H);
  ctx.lineTo(cx - roadBottomW / 2, H);
  ctx.closePath();
  ctx.fill();

  // Center Dashed Line
  roadOffset = (roadOffset + speed * 0.05) % 50;
  ctx.strokeStyle = '#ffcc00';
  ctx.lineWidth = 4;
  ctx.setLineDash([20, 20]);
  ctx.lineDashOffset = -roadOffset;
  ctx.beginPath();
  ctx.moveTo(cx, horizon);
  ctx.lineTo(cx, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // Road Edges
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(cx - roadTopW / 2, horizon);
  ctx.lineTo(cx - roadBottomW / 2, H);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + roadTopW / 2, horizon);
  ctx.lineTo(cx + roadBottomW / 2, H);
  ctx.stroke();
}

function spawnTraffic() {
  const lanes = [-0.6, 0, 0.6];
  const lane = lanes[Math.floor(Math.random() * lanes.length)];
  const colors = ['#1e90ff', '#ff8c00', '#808080', '#32cd32'];
  traffic.push({
    lane: lane,
    progress: 0.05,
    color: colors[Math.floor(Math.random() * colors.length)]
  });
}

function loop(t) {
  if (!run) return;
  let dt = Math.min((t - lastTime) / 1000, 0.05);
  lastTime = t;
  elapsed += dt;

  if (key.l) carX -= 1.8 * dt;
  if (key.r) carX += 1.8 * dt;
  carX = Math.max(-0.85, Math.min(0.85, carX));

  speed = Math.min(maxSpeed, speed + dt * 30);
  score += speed * dt * 0.2;

  ctx.clearRect(0, 0, W, H);
  drawEnvironment();
  drawRoad();

  if (Math.random() < 0.015) spawnTraffic();

  let playerBottomY = H - 100;
  let roadBottomW = Math.min(W * 0.9, 600);

  for (let i = traffic.length - 1; i >= 0; i--) {
    let car = traffic[i];
    car.progress += (speed * 0.0015) * dt;

    let y = horizon + (H - horizon) * Math.pow(car.progress, 2);
    let currentRoadW = (roadBottomW * 0.1) + (roadBottomW - (roadBottomW * 0.1)) * car.progress;
    let x = (W / 2) + car.lane * (currentRoadW / 2.3);
    let scale = 0.2 + car.progress * 0.9;

    drawSportsCar(x, y, scale, car.color, false);

    if (car.progress > 0.85 && car.progress < 0.98) {
      let px = (W / 2) + carX * (roadBottomW / 2.3);
      if (Math.abs(px - x) < 50) {
        gameOver();
        return;
      }
    }
    if (car.progress > 1.1) traffic.splice(i, 1);
  }

  let playerScreenX = (W / 2) + carX * (roadBottomW / 2.3);
  drawSportsCar(playerScreenX, playerBottomY, 1.1, '#cc0000', true);

  document.getElementById('speedo-val').textContent = Math.floor(speed);
  document.getElementById('score').textContent = Math.floor(score);
  let mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
  let secs = String(Math.floor(elapsed % 60)).padStart(2, '0');
  document.getElementById('timer').textContent = `${mins}:${secs}`;

  requestAnimationFrame(loop);
}

function startGame() {
  run = true; speed = 50; score = 0; elapsed = 0; carX = 0; traffic = [];
  document.getElementById('menu').classList.add('hide');
  document.getElementById('over').classList.add('hide');
  document.getElementById('hud').classList.remove('hide');
  document.getElementById('speedo-wrap').classList.remove('hide');
  document.getElementById('controls').classList.remove('hide');
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function gameOver() {
  run = false;
  document.getElementById('final-score').textContent = Math.floor(score);
  document.getElementById('over').classList.remove('hide');
}

function bindTouch(id, k) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); key[k] = true; });
  el.addEventListener('pointerup', e => { e.preventDefault(); key[k] = false; });
  el.addEventListener('pointercancel', e => { e.preventDefault(); key[k] = false; });
}
bindTouch('btn-l', 'l');
bindTouch('btn-r', 'r');

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') key.l = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') key.r = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') key.l = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') key.r = false;
});

document.getElementById('start-btn').onclick = startGame;
document.getElementById('again-btn').onclick = startGame;
</script>
</body>
        </html>
