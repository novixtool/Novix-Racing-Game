<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Novix Racing 2D</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#63b653;font-family:Arial}canvas{width:100%;height:100%;display:block}#hud{position:fixed;top:12px;left:12px;right:12px;color:white;display:flex;justify-content:space-between;font-weight:bold;font-size:18px;text-shadow:0 2px 3px #000}#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px}.btn{width:78px;height:78px;border-radius:50%;border:2px solid white;background:#1119;color:white;font-size:34px}.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0008}.box{background:#171717;color:white;padding:28px;border-radius:20px;text-align:center;width:88%}h1{color:#f33}.start{padding:14px 28px;border:0;border-radius:10px;background:#f33;color:white;font-size:20px;font-weight:bold}.hide{display:none}</style></head><body>
<canvas id="c"></canvas><div id="hud" class="hide"><span>🏁 Score: <b id="s">0</b></span><span>🚗 Speed: <b id="v">0</b></span></div>
<div id="controls" class="hide"><button class="btn" id="l">◀</button><button class="btn" id="r">▶</button></div>
<div id="menu" class="panel"><div class="box"><h1>Novix Racing</h1><p>2D Car Racing</p><p>◀ ▶ दबाकर कार चलाएँ और दूसरी cars से बचें।</p><button class="start" id="go">RACE START</button></div></div>
<div id="over" class="panel hide"><div class="box"><h1>GAME OVER</h1><p>Score: <b id="fs">0</b></p><button class="start" id="again">फिर से खेलें</button></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,rx,rw,p,t=[],score=0,spd=360,off=0,run=false,last=0,spawn=0,key={l:false,r:false};
function size(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);rw=Math.min(W*.78,520);rx=(W-rw)/2;if(p){p.y=H-145;p.x=Math.max(rx+10,Math.min(p.x,rx+rw-p.w-10))}}addEventListener('resize',size);size();
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function car(a,b,w,h,col){x.fillStyle='#111';x.fillRect(a-4,b+10,w+8,h-20);x.fillStyle=col;rr(a,b,w,h,10);x.fillStyle='#bde7ff';rr(a+8,b+10,w-16,20,5);x.fillStyle='#222';x.fillRect(a+3,b+7,7,16);x.fillRect(a+w-10,b+7,7,16);x.fillStyle='#ffef75';x.fillRect(a+5,b+h-12,7,7);x.fillRect(a+w-12,b+h-12,7,7)}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#63b653';x.fillRect(0,0,W,H);x.fillStyle='#3a3a3a';x.fillRect(rx,0,rw,H);x.fillStyle='white';x.fillRect(rx,0,5,H);x.fillRect(rx+rw-5,0,5,H);x.strokeStyle='white';x.lineWidth=5;x.setLineDash([34,34]);x.lineDashOffset=-off;for(let i=1;i<3;i++){let a=rx+rw*i/3;x.beginPath();x.moveTo(a,0);x.lineTo(a,H);x.stroke()}x.setLineDash([]);t.forEach(q=>car(q.x,q.y,q.w,q.h,q.col));car(p.x,p.y,p.w,p.h,'#e52525')}
function reset(){score=0;spd=360;off=0;t=[];spawn=0;p={x:W/2-24,y:H-145,w:48,h:82}}
function hit(a,b){return a.x+6<b.x+b.w-6&&a.x+a.w-6>b.x+6&&a.y+8<b.y+b.h-8&&a.y+a.h-8>b.y+8}
function add(){let lane=Math.floor(Math.random()*3),w=46,h=78;t.push({x:rx+lane*rw/3+rw/6-w/2,y:-100,w,h,col:['#1877d2','#f2c230','#ddd','#7b3fc6'][Math.floor(Math.random()*4)]})}
function loop(now){if(!run)return;let d=Math.min((now-last)/1000,.035);last=now;off=(off+spd*d)%68;if(key.l)p.x-=430*d;if(key.r)p.x+=430*d;p.x=Math.max(rx+10,Math.min(p.x,rx+rw-p.w-10));spawn-=d;if(spawn<=0){add();spawn=Math.max(.42,1.05-score/2500)}t.forEach(q=>q.y+=spd*d*(.82+score/5000));t=t.filter(q=>q.y<H+100);if(t.some(q=>hit(p,q))){end();return}score+=d*10;spd=Math.min(700,360+score*2);s.textContent=Math.floor(score);v.textContent=Math.floor(spd/4);draw();requestAnimationFrame(loop)}
function start(){reset();run=true;menu.classList.add('hide');over.classList.add('hide');hud.classList.remove('hide');controls.classList.remove('hide');last=performance.now();requestAnimationFrame(loop)}
function end(){run=false;fs.textContent=Math.floor(score);over.classList.remove('hide')}
function bind(el,k){['pointerdown','touchstart'].forEach(e=>document.getElementById(el).addEventListener(e,z=>{z.preventDefault();key[k]=true},{passive:false}));['pointerup','pointercancel','touchend'].forEach(e=>document.getElementById(el).addEventListener(e,z=>{z.preventDefault();key[k]=false},{passive:false}))}
bind('l','l');bind('r','r');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')key.l=true;if(e.key==='ArrowRight')key.r=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')key.l=false;if(e.key==='ArrowRight')key.r=false});go.onclick=start;again.onclick=start;draw();
</script></body></html>
