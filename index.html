<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Novix Racing 3D Style</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { width: 100%; height: 100%; display: block; }

    /* Top HUD */
    #hud {
      position: fixed; top: 14px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; pointer-events: none;
      color: #fff; font-weight: 800; text-transform: uppercase;
    }
    .hud-card {
      background: rgba(10, 15, 25, 0.75); border: 1px solid rgba(255,255,255,0.18);
      padding: 6px 14px; border-radius: 8px; backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .hud-title { font-size: 11px; color: #aaa; letter-spacing: 1px; }
    .hud-val { font-size: 20px; font-weight: 900; color: #fff; }

    /* Bottom Speedometer */
    #speedo-wrap {
      position: fixed; bottom: 20px; right: 20px; pointer-events: none;
      width: 120px; height: 120px; background: radial-gradient(circle, rgba(20,20,30,0.85) 40%, rgba(0,0,0,0.95));
      border: 3px solid rgba(255,255,255,0.25); border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
    }
    #speedo-val { font-size: 32px; font-weight: 900; color: #fff; line-height: 1; }
    #speedo-unit { font-size: 11px; font-weight: bold; color: #f43f5e; margin-top: 2px; }

    /* Mobile Controls (Screenshot match) */
    #controls {
      position: fixed; bottom: 30px; left: 24px;
      display: flex; gap: 18px; pointer-events: none;
    }
    .ctrl-btn {
      width: 68px; height: 68px; border-radius: 50%;
      background: rgba(255,255,255,0.18); border: 2px solid rgba(255,255,255,0.45);
      color: rgba(255,255,255,0.85); font-size: 26px; display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px); pointer-events: auto; outline: none; cursor: pointer;
    }
    .ctrl-btn:active { background: rgba(255,255,255,0.45); transform: scale(0.94); }

    /* Menus */
    .panel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.82); backdrop-filter: blur(8px); }
    .box { background: #121826; border: 1px solid #334155; color: white; padding: 30px 24px; border-radius: 20px; text-align: center; width: 88%; max-width: 380px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
    .box h1 { font-size: 32px; color: #ef4444; font-weight: 900; margin-bottom: 6px; letter-spacing: 1px; }
    .btn-action { margin-top: 20px; padding: 14px 34px; border: 0; border-radius: 12px; background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 20px rgba(239,68,68,0.5); }
    .hide { display: none !important; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud" class="hide">
    <div class="hud-card"><div class="hud-title">POS</div><div class="hud-val" id="pos">3/6</div></div>
    <div style="display:flex; gap:10px;">
      <div class="hud-card"><div class="hud-title">TIME</div><div class="hud-val" id="timer">00:00</div></div>
      <div class="hud-card"><div class="hud-title">SCORE</div><div class="hud-val" id="score">0</div></div>
    </div>
  </div>

  <div id="speedo-wrap" class="hide">
    <div id="speedo-val">0</div>
    <div id="speedo-unit">KM/H</div>
  </div>

  <div id="controls" class="hide">
    <button class="ctrl-btn" id="btn-l">◀</button>
    <button class="ctrl-btn" id="btn-r">▶</button>
  </div>

  <div id="menu" class="panel">
    <div class="box">
      <h1>NOVIX RACING</h1>
      <p style="color:#94a3b8; font-size:14px; margin-bottom:18px;">HIGH SPEED ARCADE RACER</p>
      <p style="font-size:14px; line-height:1.5;">Arrow Keys ya Buttons se car control karein aur traffic se bachein!</p>
      <button class="btn-action" id="start-btn">RACE START</button>
    </div>
  </div>

  <div id="over" class="panel hide">
    <div class="box">
      <h1 style="color:#f43f5e;">CRASHED!</h1>
      <p style="margin: 15px 0; font-size:18px;">Final Score: <b id="final-score" style="color:#38bdf8;">0</b></p>
      <button class="btn-action" id="again-btn">TRY AGAIN</button>
    </div>
  </div>

<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let W, H, horizon, run = false, lastTime = 0;
let carX = 0, speed = 0, maxSpeed = 260, score = 0, elapsed = 0;
let traffic = [], key = { l: false, r: false };

function resize() {
  W = innerWidth; H = innerHeight;
  c.width = W * devicePixelRatio; c.height = H * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  horizon = H * 0.42; // Vanishing horizon
}
window.addEventListener('resize', resize);
resize();

// Realistic Car Graphics Drawing (Rear-View Sports Car with stripes)
function drawSportsCar(x, y, scale, color, isPlayer = false) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.ellipse(0, 18, 55, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  // Wide Tires
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(-52, 2, 16, 26);
  ctx.fillRect(36, 2, 16, 26);

  // Main Bumper & Body
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(-46, -14, 92, 38, [12, 12, 8, 8]);
  ctx.fill();

  // Sports White Stripes
  if (isPlayer) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-8, -14, 6, 38);
    ctx.fillRect(2, -14, 6, 38);
  }

  // Cabin / Rear Windshield
  ctx.fillStyle = '#090d16';
  ctx.beginPath();
  ctx.moveTo(-32, -14);
  ctx.lineTo(32, -14);
  ctx.lineTo(24, -38);
  ctx.lineTo(-24, -38);
  ctx.closePath();
  ctx.fill();

  // Glass Reflection
  ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
  ctx.beginPath();
  ctx.moveTo(-18, -35);
  ctx.lineTo(8, -35);
  ctx.lineTo(2, -16);
  ctx.lineTo(-22, -16);
  ctx.closePath();
  ctx.fill();

  // Red Tail-lights
  ctx.fillStyle = '#ff1744';
  ctx.shadowColor = '#ff1744';
  ctx.shadowBlur = 10;
  ctx.fillRect(-42, -6, 20, 7);
  ctx.fillRect(22, -6, 20, 7);

  // Exhaust
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#64748b';
  ctx.fillRect(-22, 22, 10, 5);
  ctx.fillRect(12, 22, 10, 5);

  ctx.restore();
}

// Background mountains and sky
function drawEnvironment() {
  // Sky gradient
  let sky = ctx.createLinearGradient(0, 0, 0, horizon);
  sky.addColorStop(0, '#0284c7');
  sky.addColorStop(1, '#93c5fd');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, horizon);

  // Mountain silhouettes
  ctx.fillStyle = '#334155';
  ctx.beginPath();
  ctx.moveTo(0, horizon);
  ctx.lineTo(W * 0.15, horizon - 70);
  ctx.lineTo(W * 0.35, horizon);
  ctx.lineTo(W * 0.6, horizon - 90);
  ctx.lineTo(W * 0.85, horizon - 40);
  ctx.lineTo(W, horizon);
  ctx.fill();

  // Roadside Grass / Terrain
  ctx.fillStyle = '#15803d';
  ctx.fillRect(0, horizon, W, H - horizon);
}

// Pseudo-3D Perspective Road
let roadOffset = 0;
function drawRoad() {
  let roadBottomW = Math.min(W * 0.94, 650);
  let roadTopW = roadBottomW * 0.12;
  let cx = W / 2;

  // Road base
  ctx.fillStyle = '#334155';
  ctx.beginPath();
  ctx.moveTo(cx - roadTopW / 2, horizon);
  ctx.lineTo(cx + roadTopW / 2, horizon);
  ctx.lineTo(cx + roadBottomW / 2, H);
  ctx.lineTo(cx - roadBottomW / 2, H);
  ctx.closePath();
  ctx.fill();

  // Perspective Striped Lines
  roadOffset = (roadOffset + speed * 0.05) % 40;
  ctx.strokeStyle = '#facc15';
  ctx.lineWidth = 4;
  ctx.setLineDash([20, 20]);
  ctx.lineDashOffset = -roadOffset;

  ctx.beginPath();
  ctx.moveTo(cx, horizon);
  ctx.lineTo(cx, H);
  ctx.stroke();
  ctx.setLineDash([]);
}

function spawnTraffic() {
  const lanes = [-0.65, 0, 0.65];
  const lane = lanes[Math.floor(Math.random() * lanes.length)];
  const colors = ['#2563eb', '#eab308', '#64748b', '#10b981'];
  traffic.push({
    lane: lane,
    progress: 0.05, // 0 at horizon, 1 at player
    color: colors[Math.floor(Math.random() * colors.length)]
  });
}

function loop(t) {
  if (!run) return;
  let dt = Math.min((t - lastTime) / 1000, 0.05);
  lastTime = t;
  elapsed += dt;

  // Car lateral speed
  if (key.l) carX -= 1.6 * dt;
  if (key.r) carX += 1.6 * dt;
  carX = Math.max(-0.85, Math.min(0.85, carX));

  // Speed build-up
  speed = Math.min(maxSpeed, speed + dt * 25);
  score += speed * dt * 0.2;

  // Render Scene
  ctx.clearRect(0, 0, W, H);
  drawEnvironment();
  drawRoad();

  // Traffic AI & 3D projection
  if (Math.random() < 0.02) spawnTraffic();

  let playerBottomY = H - 90;
  let roadBottomW = Math.min(W * 0.94, 650);

  for (let i = traffic.length - 1; i >= 0; i--) {
    let car = traffic[i];
    car.progress += (speed * 0.0016) * dt;

    let y = horizon + (H - horizon) * Math.pow(car.progress, 2);
    let currentRoadW = (roadBottomW * 0.12) + (roadBottomW - (roadBottomW * 0.12)) * car.progress;
    let x = (W / 2) + car.lane * (currentRoadW / 2.3);
    let scale = 0.2 + car.progress * 0.85;

    drawSportsCar(x, y, scale, car.color, false);

    // Collision Check
    if (car.progress > 0.82 && car.progress < 0.98) {
      let px = (W / 2) + carX * (roadBottomW / 2.3);
      if (Math.abs(px - x) < 55) {
        gameOver();
        return;
      }
    }
    if (car.progress > 1.1) traffic.splice(i, 1);
  }

  // Draw Player Car
  let playerScreenX = (W / 2) + carX * (roadBottomW / 2.3);
  drawSportsCar(playerScreenX, playerBottomY, 1.05, '#dc2626', true);

  // Update UI Elements
  document.getElementById('speedo-val').textContent = Math.floor(speed);
  document.getElementById('score').textContent = Math.floor(score);
  let mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
  let secs = String(Math.floor(elapsed % 60)).padStart(2, '0');
  document.getElementById('timer').textContent = `${mins}:${secs}`;

  requestAnimationFrame(loop);
}

function startGame() {
  run = true; speed = 50; score = 0; elapsed = 0; carX = 0; traffic = [];
  document.getElementById('menu').classList.add('hide');
  document.getElementById('over').classList.add('hide');
  document.getElementById('hud').classList.remove('hide');
  document.getElementById('speedo-wrap').classList.remove('hide');
  document.getElementById('controls').classList.remove('hide');
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function gameOver() {
  run = false;
  document.getElementById('final-score').textContent = Math.floor(score);
  document.getElementById('over').classList.remove('hide');
}

// Controls
function bindTouch(id, k) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); key[k] = true; });
  el.addEventListener('pointerup', e => { e.preventDefault(); key[k] = false; });
  el.addEventListener('pointercancel', e => { e.preventDefault(); key[k] = false; });
}
bindTouch('btn-l', 'l');
bindTouch('btn-r', 'r');

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') key.l = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') key.r = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') key.l = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') key.r = false;
});

document.getElementById('start-btn').onclick = startGame;
document.getElementById('again-btn').onclick = startGame;
</script>
</body>
</html>
