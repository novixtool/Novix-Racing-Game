<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Subway Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { width: 100%; height: 100%; display: block; }

    #hud {
      position: fixed; top: 15px; left: 15px; right: 15px;
      display: flex; justify-content: space-between; pointer-events: none;
      color: #fff; font-weight: 800; z-index: 10;
    }
    .hud-card {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 12px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
    }
    .hud-title { font-size: 10px; color: #aaa; }
    .hud-val { font-size: 22px; font-weight: 900; color: #fff; }

    #controls {
      position: fixed; bottom: 30px; left: 24px; right: 24px;
      display: flex; justify-content: space-between;
    }
    .ctrl-btn {
      width: 75px; height: 75px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: #fff; font-size: 28px;
      display: flex; align-items: center; justify-content: center;
      outline: none; cursor: pointer;
      backdrop-filter: blur(10px);
    }
    .ctrl-btn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.92); }

    .panel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); }
    .box {
      background: linear-gradient(135deg, #0d1117, #161b22);
      border: 1px solid #30363d;
      color: white; padding: 30px 24px; border-radius: 16px;
      text-align: center; width: 90%; max-width: 400px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    }
    .box h1 { font-size: 30px; color: #fff; margin-bottom: 6px; }
    .btn-action {
      margin-top: 18px; padding: 14px 40px; border: 0; border-radius: 10px;
      background: linear-gradient(135deg, #ff4444, #cc0000);
      color: white; font-size: 18px; font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255,68,68,0.4);
    }
    .hide { display: none !important; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud" class="hide">
    <div class="hud-card"><div class="hud-title">SCORE</div><div class="hud-val" id="score">0</div></div>
    <div class="hud-card"><div class="hud-title">COINS</div><div class="hud-val" id="coins">0</div></div>
    <div class="hud-card"><div class="hud-title">SPEED</div><div class="hud-val" id="speed">0</div></div>
  </div>

  <div id="controls" class="hide">
    <button class="ctrl-btn" id="btn-l">◀</button>
    <button class="ctrl-btn" id="btn-r">▶</button>
  </div>

  <div id="menu" class="panel">
    <div class="box">
      <h1>SUBWAY RUNNER</h1>
      <p style="color:#888; font-size:14px; margin-bottom:15px;">ENDLESS RUNNER GAME</p>
      <button class="btn-action" id="start-btn">PLAY</button>
    </div>
  </div>

  <div id="over" class="panel hide">
    <div class="box">
      <h1 style="color:#ff4444;">GAME OVER!</h1>
      <p style="margin: 15px 0; font-size:16px;">Score: <b id="final-score" style="color:#38bdf8;">0</b></p>
      <p style="font-size:14px; color:#aaa;">Coins: <b id="final-coins" style="color:#ffd700;">0</b></p>
      <button class="btn-action" id="again-btn">TRY AGAIN</button>
    </div>
  </div>

<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let W, H, run = false, lastTime = 0;
let score = 0, coins = 0, speed = 10;
let playerLane = 1, targetLane = 1;
let obstacles = [], coinList = [], particles = [];
let groundOffset = 0;

function resize() {
  W = innerWidth; H = innerHeight;
  c.width = W * devicePixelRatio; c.height = H * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// Lane position (3 lanes)
function laneX(lane) {
  return (W / 2) + (lane - 1) * (W * 0.3);
}

// Player character (2.5D style)
function drawPlayer() {
  let x = laneX(playerLane);
  let y = H - 120;
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(x, y + 40, 25, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Body
  ctx.fillStyle = '#ff4444';
  ctx.fillRect(x - 18, y - 30, 36, 60);
  
  // Head
  ctx.fillStyle = '#ffcc99';
  ctx.beginPath();
  ctx.arc(x, y - 40, 15, 0, Math.PI * 2);
  ctx.fill();
  
  // Hair
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(x, y - 45, 14, Math.PI, Math.PI * 2);
  ctx.fill();
  
  // Arms (running animation)
  let armSwing = Math.sin(performance.now() / 100) * 20;
  ctx.fillStyle = '#ffcc99';
  ctx.fillRect(x - 25, y - 15 + armSwing, 10, 25);
  ctx.fillRect(x + 15, y - 15 - armSwing, 10, 25);
  
  // Legs
  ctx.fillStyle = '#3366ff';
  ctx.fillRect(x - 15, y + 20, 12, 20);
  ctx.fillRect(x + 3, y + 20, 12, 20);
  
  // Backpack
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(x - 10, y - 20, 20, 35);
}

// Obstacles (train/barrier)
function drawObstacle(obs) {
  let x = laneX(obs.lane);
  let y = obs.y;
  
  if (obs.type === 'train') {
    // Train
    ctx.fillStyle = '#666';
    ctx.fillRect(x - 30, y - 50, 60, 50);
    ctx.fillStyle = '#888';
    ctx.fillRect(x - 25, y - 45, 50, 40);
  } else if (obs.type === 'barrier') {
    // Barrier
    ctx.fillStyle = '#ff6600';
    ctx.fillRect(x - 20, y - 30, 40, 30);
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(x - 20, y - 25, 40, 5);
  }
}

// Coins
function drawCoin(coin) {
  let x = laneX(coin.lane);
  let y = coin.y;
  
  ctx.fillStyle = '#ffd700';
  ctx.shadowColor = '#ffd700';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(x, y, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  ctx.fillStyle = '#ffaa00';
  ctx.beginPath();
  ctx.arc(x, y, 8, 0, Math.PI * 2);
  ctx.fill();
}

// Environment (2.5D ground)
function drawEnvironment() {
  // Sky
  let skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#87ceeb');
  skyGrad.addColorStop(1, '#e0f7fa');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);
  
  // Clouds
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  for (let i = 0; i < 5; i++) {
    let cx = (i * 200 + 50) % W;
    let cy = 50 + i * 20;
    ctx.beginPath();
    ctx.arc(cx, cy, 20, 0, Math.PI * 2);
    ctx.arc(cx + 15, cy - 5, 18, 0, Math.PI * 2);
    ctx.arc(cx + 30, cy, 15, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Ground (moving)
  groundOffset = (groundOffset + speed * 0.5) % 100;
  ctx.fillStyle = '#4a4a4a';
  ctx.fillRect(0, H - 80, W, 80);
  
  // Track lines
  ctx.strokeStyle = '#ffcc00';
  ctx.lineWidth = 3;
  for (let i = 0; i < 4; i++) {
    let x = laneX(i);
    ctx.beginPath();
    ctx.moveTo(x, H - 80);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  
  // Moving ground pattern
  ctx.fillStyle = '#3a3a3a';
  for (let i = 0; i < 10; i++) {
    let x = (i * 60 - groundOffset) % W;
    ctx.fillRect(x, H - 80, 30, 80);
  }
}

function spawnObstacle() {
  let lane = Math.floor(Math.random() * 3);
  let type = Math.random() > 0.5 ? 'train' : 'barrier';
  obstacles.push({ lane: lane, y: -100, type: type });
}

function spawnCoin() {
  let lane = Math.floor(Math.random() * 3);
  coinList.push({ lane: lane, y: -50 });
}

function loop(t) {
  if (!run) return;
  let dt = Math.min((t - lastTime) / 1000, 0.05);
  lastTime = t;
  
  // Score update
  score += speed * dt;
  speed = Math.min(30, speed + dt * 2);
  
  // Player movement
  if (targetLane > playerLane) playerLane += dt * 10;
  if (targetLane < playerLane) playerLane -= dt * 10;
  playerLane = Math.max(0, Math.min(2, playerLane));
  
  // Spawn obstacles/coins
  if (Math.random() < 0.02) spawnObstacle();
  if (Math.random() < 0.03) spawnCoin();
  
  // Move obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    let obs = obstacles[i];
    obs.y += speed * 2 * dt;
    
    if (obs.y > H) {
      obstacles.splice(i, 1);
      continue;
    }
    
    // Collision detection
    let px = laneX(playerLane);
    let ox = laneX(obs.lane);
    if (Math.abs(px - ox) < 30 && obs.y > H - 150 && obs.y < H - 50) {
      gameOver();
      return;
    }
  }
  
  // Move coins
  for (let i = coinList.length - 1; i >= 0; i--) {
    let coin = coinList[i];
    coin.y += speed * 2 * dt;
    
    if (coin.y > H) {
      coinList.splice(i, 1);
      continue;
    }
    
    // Coin collection
    let px = laneX(playerLane);
    let cx = laneX(coin.lane);
    if (Math.abs(px - cx) < 30 && coin.y > H - 160 && coin.y < H - 50) {
      coins++;
      coinList.splice(i, 1);
    }
  }
  
  // Render
  ctx.clearRect(0, 0, W, H);
  drawEnvironment();
  
  // Draw obstacles
  for (let obs of obstacles) drawObstacle(obs);
  
  // Draw coins
  for (let coin of coinList) drawCoin(coin);
  
  // Draw player
  drawPlayer();
  
  // Update UI
  document.getElementById('score').textContent = Math.floor(score);
  document.getElementById('coins').textContent = coins;
  document.getElementById('speed').textContent = Math.floor(speed * 10);
  
  requestAnimationFrame(loop);
}

function startGame() {
  run = true; score = 0; coins = 0; speed = 10;
  playerLane = 1; targetLane = 1;
  obstacles = []; coinList = [];
  document.getElementById('menu').classList.add('hide');
  document.getElementById('over').classList.add('hide');
  document.getElementById('hud').classList.remove('hide');
  document.getElementById('controls').classList.remove('hide');
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function gameOver() {
  run = false;
  document.getElementById('final-score').textContent = Math.floor(score);
  document.getElementById('final-coins').textContent = coins;
  document.getElementById('over').classList.remove('hide');
}

// Controls
function bindTouch(id, k) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); key[k] = true; });
  el.addEventListener('pointerup', e => { e.preventDefault(); key[k] = false; });
  el.addEventListener('pointercancel', e => { e.preventDefault(); key[k] = false; });
}
bindTouch('btn-l', 'l');
bindTouch('btn-r', 'r');

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
    if (targetLane > 0) targetLane--;
  }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
    if (targetLane < 2) targetLane++;
  }
});

document.getElementById('start-btn').onclick = startGame;
document.getElementById('again-btn').onclick = startGame;
</script>
</body>
  </html>
